# اجرای پیام‌رسان پشت Caddy با HTTPS خودکار (Let's Encrypt).
#
#   cp .env.example .env   # و دامنه‌ی خودتان را در آن بنویسید
#   docker compose up -d
services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: messenger
    restart: unless-stopped
    environment:
      - PORT=3000
      - DATA_DIR=/data
      - MAX_IMAGE_BYTES=${MAX_IMAGE_BYTES:-8388608}
    volumes:
      - messenger-data:/data
    expose:
      - "3000"

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    environment:
      - DOMAIN=${DOMAIN:?دامنه را در فایل .env تعیین کنید}
      - TLS_EMAIL=${TLS_EMAIL:-}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - app

volumes:
  messenger-data:
  caddy-data:
  caddy-config:
