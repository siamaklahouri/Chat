# جایگزین Caddy برای کسانی که nginx را ترجیح می‌دهند.
# گواهی را با certbot بگیرید:
#   certbot --nginx -d chat.example.com

upstream messenger {
    server 127.0.0.1:3000;
}

server {
    listen 80;
    server_name chat.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name chat.example.com;

    ssl_certificate     /etc/letsencrypt/live/chat.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.example.com/privkey.pem;

    # کمی بیشتر از بیشینه‌ی حجم عکس (۸ مگابایت)
    client_max_body_size 12m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;

    location / {
        proxy_pass http://messenger;
        proxy_http_version 1.1;

        # بدون این دو هدر، وب‌سوکت (پیام زنده) کار نمی‌کند.
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 3600s;   # اتصال وب‌سوکت نباید زود قطع شود
        proxy_buffering off;        # آپلود و دانلود عکس روان بماند
    }
}
