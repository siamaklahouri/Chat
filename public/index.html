<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="theme-color" content="#0f1720" />
<link rel="preload" href="/fonts/outfit-600-latin.woff2" as="font" type="font/woff2" crossorigin />
<meta name="description" content="9chat — چت و ارسال عکس" />
<meta name="mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<title>9chat</title>
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<link rel="apple-touch-icon" href="/icons/icon-192.png" />
<link rel="stylesheet" href="/css/style.css" />
</head>
<body>

<!-- ورود و ثبت‌نام -->
<section id="authScreen" class="screen auth-screen">
  <div class="auth-card">
    <div class="brand">
      <h1 class="brand-lockup" aria-label="9chat">
        <svg class="brand-mark" viewBox="22.5 14.5 61 73" aria-hidden="true">
          <g fill="none" stroke="currentColor" stroke-width="11">
            <circle cx="50" cy="42" r="22"/>
            <path d="M72 42 V60 Q72 82 46 82" stroke-linecap="round"/>
          </g>
          <circle cx="50" cy="42" r="5.5" fill="#2ee6a6"/>
        </svg>
        <span class="brand-word">chat</span>
      </h1>
      <p class="muted">گفتگو و ارسال عکس، ساده و سریع</p>
    </div>

    <div class="tabs" role="tablist">
      <button class="tab is-active" data-auth-tab="login" role="tab">ورود</button>
      <button class="tab" data-auth-tab="register" role="tab">ثبت‌نام</button>
    </div>

    <form id="loginForm" class="auth-form" autocomplete="on">
      <label class="field">
        <span>نام کاربری</span>
        <input name="username" type="text" inputmode="latin" autocapitalize="none" placeholder="username" required />
      </label>
      <label class="field">
        <span>رمز عبور</span>
        <input name="password" type="password" placeholder="••••••" required />
      </label>
      <button class="btn btn-primary" type="submit">ورود</button>
    </form>

    <form id="registerForm" class="auth-form is-hidden" autocomplete="on">
      <label class="field">
        <span>نام نمایشی</span>
        <input name="displayName" type="text" placeholder="نام شما" maxlength="40" required />
      </label>
      <label class="field">
        <span>نام کاربری</span>
        <input name="username" type="text" inputmode="latin" autocapitalize="none" placeholder="فقط حروف انگلیسی، عدد و _" required />
      </label>
      <label class="field">
        <span>رمز عبور</span>
        <input name="password" type="password" placeholder="حداقل ۸ نویسه" minlength="8" required />
      </label>
      <button class="btn btn-primary" type="submit">ثبت‌نام</button>
      <p class="hint">پس از ثبت‌نام، حساب شما باید توسط مدیر تایید شود.</p>
    </form>

    <p id="authMessage" class="auth-message" role="status"></p>
  </div>
</section>

<!-- برنامه اصلی -->
<main id="appScreen" class="screen app-screen is-hidden">
  <!-- ستون گفتگوها -->
  <aside id="sidebar" class="sidebar">
    <header class="sidebar-header">
      <button id="profileBtn" class="avatar-btn" title="پروفایل">
        <span id="meAvatar" class="avatar"></span>
      </button>
      <div class="sidebar-title">
        <strong id="meName">…</strong>
        <small id="connectionState" class="muted">در حال اتصال…</small>
      </div>
      <a id="adminLink" href="/admin" class="icon-btn is-hidden" title="پنل مدیریت" aria-label="پنل مدیریت">
        <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 2 4 5v6c0 5 3.4 9.4 8 11 4.6-1.6 8-6 8-11V5l-8-3Zm0 6a2.5 2.5 0 1 1 0 5 2.5 2.5 0 0 1 0-5Zm0 11c-1.9 0-3.6-1-4.6-2.4.1-1.5 3.1-2.3 4.6-2.3s4.5.8 4.6 2.3A5.6 5.6 0 0 1 12 19Z"/></svg>
      </a>
      <button id="themeBtn" class="icon-btn" title="تغییر تم" aria-label="تغییر تم روشن/تیره">
        <svg class="theme-icon-dark" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 3a9 9 0 1 0 9 9c0-.3 0-.6-.05-.9A7 7 0 0 1 12.9 3.05C12.6 3 12.3 3 12 3Z"/></svg>
        <svg class="theme-icon-light" viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M12 7a5 5 0 1 0 0 10 5 5 0 0 0 0-10Zm0-5h1v3h-2V2zm0 17h1v3h-2v-3zM2 11h3v2H2zm17 0h3v2h-3zM4.2 5.6 5.6 4.2l2.1 2.1L6.3 7.7zm12.1 12.1 1.4-1.4 2.1 2.1-1.4 1.4zM18.4 4.2l1.4 1.4-2.1 2.1-1.4-1.4zM6.3 16.3l1.4 1.4-2.1 2.1-1.4-1.4z"/></svg>
      </button>
      <button id="newChatBtn" class="icon-btn" title="گفتگوی جدید" aria-label="گفتگوی جدید">
        <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M13 5h-2v6H5v2h6v6h2v-6h6v-2h-6z"/></svg>
      </button>
    </header>

    <div class="search-row">
      <input id="conversationSearch" type="search" placeholder="جستجو در گفتگوها…" />
    </div>

    <div id="conversationList" class="conversation-list"></div>

    <footer class="sidebar-footer">
      <span id="wipeInfo" class="muted"></span>
    </footer>
  </aside>

  <!-- ستون گفتگو -->
  <section id="chatPanel" class="chat-panel">
    <div id="emptyState" class="empty-state">
      <svg class="empty-mark" viewBox="0 0 24 24" width="64" height="64" aria-hidden="true">
        <path fill="currentColor" d="M12 3a9 9 0 0 0-7.7 13.7L3 21l4.4-1.2A9 9 0 1 0 12 3Zm-3.5 7.5h7v1.5h-7zm0 3.5h4.5v1.5H8.5z"/>
      </svg>
      <p class="empty-title">گفتگویی باز نیست</p>
      <p class="muted">از فهرست کنار صفحه یکی را باز کنید، یا با دکمه‌ی ＋ گفتگوی تازه‌ای بسازید.</p>
    </div>

    <div id="chatView" class="chat-view is-hidden">
      <header class="chat-header">
        <button id="backBtn" class="icon-btn only-mobile" aria-label="بازگشت">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="m10 6 1.4 1.4L7.8 11H20v2H7.8l3.6 3.6L10 18l-6-6z"/></svg>
        </button>
        <span id="chatAvatar" class="avatar"></span>
        <div class="chat-title">
          <strong id="chatName">…</strong>
          <small id="chatStatus" class="muted"></small>
        </div>
        <button id="callBtn" class="icon-btn is-hidden" title="تماس صوتی" aria-label="تماس صوتی">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.5.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.57 3.5a1 1 0 0 1-.25 1z"/></svg>
        </button>
        <button id="chatInfoBtn" class="icon-btn" aria-label="اطلاعات گفتگو">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M11 7h2v2h-2zm0 4h2v6h-2zm1-9a10 10 0 1 0 0 20 10 10 0 0 0 0-20Z"/></svg>
        </button>
      </header>

      <div class="message-area">
        <div id="messageList" class="message-list"></div>
        <button id="jumpToLatest" class="jump-btn is-hidden" type="button" aria-label="رفتن به آخرین پیام">
          <svg viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path fill="currentColor" d="M12 16.5 5.5 10l1.4-1.4L12 13.7l5.1-5.1L18.5 10z"/>
          </svg>
          <span class="jump-badge is-hidden"></span>
        </button>
      </div>

      <div id="typingIndicator" class="typing-indicator is-hidden"></div>

      <div id="replyBar" class="reply-bar is-hidden">
        <div class="reply-bar-text">
          <small>پاسخ به <b id="replyAuthor"></b></small>
          <span id="replyPreview"></span>
        </div>
        <button id="cancelReply" class="icon-btn" aria-label="لغو پاسخ">✕</button>
      </div>

      <div id="imagePreview" class="image-preview is-hidden">
        <img id="imagePreviewImg" alt="پیش‌نمایش عکس" />
        <div class="image-preview-meta">
          <span id="imagePreviewName"></span>
          <small id="imagePreviewSize" class="muted"></small>
        </div>
        <button id="cancelImage" class="icon-btn" aria-label="حذف عکس">✕</button>
      </div>

      <!-- نوار ضبط صدا، فقط هنگام ضبط دیده می‌شود -->
      <div id="recordBar" class="record-bar is-hidden">
        <button id="cancelRecord" type="button" class="icon-btn" aria-label="لغو ضبط">
          <svg viewBox="0 0 24 24" width="20" height="20"><path fill="currentColor" d="M9 3h6l1 2h4v2H4V5h4zM6 9h12l-1 11a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2z"/></svg>
        </button>
        <span class="record-dot" aria-hidden="true"></span>
        <span id="recordTime" class="record-time">۰:۰۰</span>
        <span class="record-hint muted">در حال ضبط…</span>
        <button id="stopRecord" type="button" class="send-btn" aria-label="ارسال پیام صوتی">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
        </button>
      </div>

      <form id="composer" class="composer">
        <input id="imageInput" type="file" accept="image/*" class="is-hidden" />
        <button id="attachBtn" type="button" class="icon-btn" title="ارسال عکس" aria-label="ارسال عکس">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M19 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V5a2 2 0 0 0-2-2Zm0 16H5l3.5-4.5 2.5 3L14.5 12 19 19Z"/></svg>
        </button>
        <textarea id="messageInput" rows="1" placeholder="پیام بنویسید…" maxlength="4000"></textarea>
        <button id="micBtn" type="button" class="icon-btn" title="پیام صوتی" aria-label="ضبط پیام صوتی">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"/></svg>
        </button>
        <button id="sendBtn" class="send-btn" type="submit" aria-label="ارسال">
          <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M3 20.5 21 12 3 3.5 3 10l12 2-12 2z"/></svg>
        </button>
      </form>
    </div>
  </section>
</main>

<!-- پنجره‌ها -->
<div id="modalRoot" class="modal-root is-hidden">
  <div class="modal-backdrop" data-close-modal></div>
  <div class="modal" role="dialog" aria-modal="true">
    <header class="modal-header">
      <strong id="modalTitle"></strong>
      <button class="icon-btn" data-close-modal aria-label="بستن">✕</button>
    </header>
    <div id="modalBody" class="modal-body"></div>
  </div>
</div>

<div id="lightbox" class="lightbox is-hidden">
  <button class="icon-btn lightbox-close" aria-label="بستن">✕</button>
  <a id="lightboxDownload" class="icon-btn lightbox-download" download aria-label="دانلود">
    <svg viewBox="0 0 24 24" width="22" height="22"><path fill="currentColor" d="M12 16l-5-5h3V4h4v7h3zM5 18h14v2H5z"/></svg>
  </a>
  <img id="lightboxImg" alt="عکس" />
</div>

<!-- صفحه‌ی تماس صوتی -->
<div id="callOverlay" class="call-overlay is-hidden" role="dialog" aria-modal="true" aria-label="تماس صوتی">
  <div class="call-card">
    <span id="callAvatar" class="avatar call-avatar"></span>
    <strong id="callName" class="call-name">…</strong>
    <span id="callState" class="call-state muted">در حال اتصال…</span>
    <div class="call-actions">
      <button id="callAccept" type="button" class="call-btn call-accept is-hidden" aria-label="پاسخ">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M6.6 10.8a15.1 15.1 0 0 0 6.6 6.6l2.2-2.2a1 1 0 0 1 1-.25c1.1.37 2.3.57 3.5.57a1 1 0 0 1 1 1V20a1 1 0 0 1-1 1A17 17 0 0 1 3 4a1 1 0 0 1 1-1h3.5a1 1 0 0 1 1 1c0 1.2.2 2.4.57 3.5a1 1 0 0 1-.25 1z"/></svg>
      </button>
      <button id="callMute" type="button" class="call-btn call-mute is-hidden" aria-label="بی‌صدا کردن میکروفون">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M12 14a3 3 0 0 0 3-3V5a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11Z"/></svg>
      </button>
      <button id="callHangup" type="button" class="call-btn call-hangup" aria-label="پایان تماس">
        <svg viewBox="0 0 24 24" width="24" height="24"><path fill="currentColor" d="M3.4 15.3 2 13.9a17 17 0 0 1 20 0l-1.4 1.4a1 1 0 0 1-1.2.1l-2.6-1.7a1 1 0 0 1-.45-.83V11a12 12 0 0 0-6.7 0v1.87a1 1 0 0 1-.45.83L6.6 15.4a1 1 0 0 1-1.2-.1z"/></svg>
      </button>
    </div>
  </div>
  <audio id="remoteAudio" autoplay playsinline></audio>
</div>

<div id="toast" class="toast is-hidden" role="alert"></div>

<script src="/js/app.js"></script>
</body>
</html>
